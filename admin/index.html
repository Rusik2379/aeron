<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Управление сайтом — АЭРОН</title><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body>
<section id="auth-screen" class="auth-screen"><div class="auth-card"><a class="brand" href="/">АЭРОН<span>Управление сайтом</span></a><p class="eyebrow">Панель редактора</p><h1 id="auth-title">Вход в админку</h1><p id="auth-description">Статьи, объекты и реквизиты компании.</p><form id="auth-form"><label>Пароль<input id="password" type="password" autocomplete="current-password" required maxlength="200"></label><label id="confirm-label" hidden>Повторите пароль<input id="password-confirm" type="password" autocomplete="new-password" maxlength="200"></label><button class="button" id="auth-submit" type="submit">Войти</button><p id="auth-message" role="status" aria-live="polite"></p></form><a class="subtle" href="/">← Вернуться на сайт</a></div></section>
<div id="app" class="app" hidden><aside class="sidebar"><a class="brand" href="/">АЭРОН<span>Управление сайтом</span></a><p class="eyebrow">Материалы сайта</p><nav aria-label="Разделы админки"><button class="tab active" data-tab="articles">Статьи <span id="article-count"></span></button><button class="tab" data-tab="projects">Объекты <span id="project-count"></span></button><button class="tab" data-tab="settings">Контакты и реквизиты</button><button class="tab" data-tab="geography">География работ</button><button class="tab" data-tab="mail">Заявки на почту</button></nav><div class="sidebar-bottom"><a href="/" target="_blank" rel="noopener">Открыть сайт ↗</a><button id="logout" class="subtle">Выйти</button></div></aside><main class="main"><header class="admin-header"><div><p class="eyebrow">АЭРОН / Редактор</p><h1 id="page-title">Статьи</h1></div><button class="button" id="new-record">Добавить статью +</button></header><p id="message" class="message" role="status" aria-live="polite"></p><div id="content"></div></main></div>
</body></html>
